<style>
/* Layout: one mobile column — product → option groups → buyer → sticky save bar */
/* 리틀프린트 공지 감성: 따뜻한 아이보리 바탕, 갈색 본문, 보라 포인트, 민트 그린 확인색, JUA 제목 (라이트 단일 테마) */
:root {
  --bg: #F8F4F1;
  --surface: #FFFFFF;
  --ink: #5B4F49;
  --muted: #7E726C;
  --line: #EADFD7;
  --chip: #F1E9E3;
  --accent: #6E56CF;
  --accent-ink: #FFFFFF;
  --warn-bg: #FBE9E7;
  --warn-ink: #A23B32;
  --ok-bg: #E3F3EA;
  --ok-ink: #2F7A55;
  --dot1: #9CC6F0; --dot2: #F6AFC4; --dot3: #B9A6EE; --dot4: #8FDCC8;
  --f-display: 'Jua', 'Apple SD Gothic Neo', sans-serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  /* 네임택 글자: 영문 Poppins Black + 한글 JUA (파이프라인 폰트 설정과 동일) */
  --f-tag: 'Poppins', 'Jua', 'Apple SD Gothic Neo', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 140px; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.head { position: relative; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.logo { width: 96px; height: auto; display: block; }
.head h1 { font-family: var(--f-display); font-weight: 400; font-size: 24px; letter-spacing: -0.5px; line-height: 1.2; }
.head p { margin: 0; color: var(--muted); font-family: var(--f-display); font-size: 14px; line-height: 1.6; }
.dots { position: absolute; inset: 0; pointer-events: none; }
.dots i { position: absolute; width: 10px; height: 10px; border-radius: 50%; opacity: .55; }
h2, h3, .stitle, .btn, .ghead .t b, .pcard b, .lbl, .sec-title span, .bar .sum b { font-family: var(--f-display); font-weight: 400; }
.sec-title h2 { font-size: 17px; }
.stitle { font-size: 16px; }
.btn { font-size: 15px; }
.snum { background: var(--accent) !important; color: #fff !important; }
section { display: flex; flex-direction: column; gap: 12px; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-title h2 { font-size: 18px; }
.sec-title span { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.chip[aria-pressed="true"] { border: 2px solid var(--ink); padding: 0 13px; font-weight: 600; }
.chip:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw { width: 20px; height: 20px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.18); flex: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 14px; font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); }
input[type="text"], textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
textarea { resize: vertical; min-height: 132px; line-height: 1.6; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--warn-ink); }
.btn.sm { min-height: 44px; padding: 0 12px; font-size: 14px; border-radius: 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.add { border: 2px dashed var(--line); background: transparent; min-height: 56px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.picked { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.picked b { font-size: 18px; }
.ghead { display: flex; align-items: center; gap: 10px; }
.ghead .t { flex: 1; min-width: 0; }
.ghead .t b { display: block; font-size: 15px; }
.ghead .t span { font-size: 13px; color: var(--muted); }
.gnum { width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; background: var(--chip); flex: none; font-variant-numeric: tabular-nums; }
.tags { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tag { height: 44px; border-radius: 22px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px; font-family: var(--f-tag); font-weight: 900; font-synthesis: none; font-size: 18px; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08), inset 0 0 0 1px rgba(0,0,0,0.12); min-width: 0; }
.tag .ic { width: 34px; height: 34px; border-radius: 17px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; flex: none; font-family: var(--f-body); font-size: 11px; font-weight: 700; color: #2B2320; }
.tag.noic { padding-left: 14px; }
.tag .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.more { font-size: 13px; color: var(--muted); }
.note { padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 500; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.ok { background: var(--ok-bg); color: var(--ok-ink); }
.editor { border: 1.5px solid #CFC3BA; gap: 0; }
.editor h3 { padding-bottom: 6px; }
.step { display: flex; flex-direction: column; gap: 12px; padding: 18px 0; border-top: 1px dashed var(--line); }
.step + .row { padding-top: 6px; }
.shead { display: flex; align-items: center; gap: 10px; }
.snum { width: 26px; height: 26px; border-radius: 13px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.stitle { font-size: 17px; font-weight: 700; }
.sval { margin-left: auto; padding: 4px 10px; border-radius: 999px; background: var(--ok-bg); color: var(--ok-ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
.sval.todo { background: var(--chip); color: var(--muted); font-weight: 500; }
.empty { text-align: center; color: var(--muted); font-size: 14px; padding: 18px 8px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.bar .in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar .sum { flex: 1; min-width: 0; }
.bar .sum b { font-size: 18px; font-variant-numeric: tabular-nums; }
.bar .sum span { display: block; font-size: 13px; color: var(--muted); }
.done h2 { font-size: 20px; }
.done ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pcard { display: flex; flex-direction: column; gap: 8px; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.pimg { width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--chip); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 12px; }
.pimg img { width: 100%; height: 100%; object-fit: cover; }
.pimg.photo, .pgrid.sm .pimg.photo { padding: 0; }
.pimg .tag { width: 100%; }
.pcard b { font-size: 15px; padding: 0 2px; }
.pgrid.sm { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pgrid.sm .pimg { padding: 6px; border-radius: 12px; }
.pgrid.sm .tag { height: 34px; font-size: 13px; padding: 0 8px 0 3px; gap: 3px; }
.pgrid.sm .tag .ic { width: 26px; height: 26px; }
.pgrid.sm .tag .ic svg { width: 16px; height: 16px; }
.pgrid.sm .pcard b { font-size: 13px; line-height: 1.3; }
.pcard[aria-pressed="true"] .pimg { border: 2px solid var(--ink); }
.psel { display: flex; align-items: center; gap: 10px; }
.psel b { flex: 1; min-width: 0; font-size: 16px; }
.pimg.sm { width: 52px; height: 52px; padding: 0; flex: none; }
.pcard:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 16px; }
.topnav { display: flex; align-items: center; gap: 8px; }
.crow { display: flex; flex-direction: column; gap: 6px; }
.crow .cap { font-size: 12px; color: var(--muted); letter-spacing: 0.2px; }
.cgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cbtn { min-height: 52px; } .ebtn, .cbtn { min-height: 52px; padding: 6px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; min-width: 0; }
.ebtn[aria-pressed="true"], .cbtn[aria-pressed="true"] { border: 2px solid var(--ink); padding: 5px 3px; font-weight: 700; }
.cbtn .mini { width: 100%; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-family: var(--f-tag); font-weight: 900; font-synthesis: none; font-size: 18px; white-space: nowrap; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.14); }
.cbtn span:last-child, .ebtn span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.ebtn .ei { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.14); font-weight: 700; }
.ei.charm, .ic.charm { box-shadow: none; }
.ei.charm { width: 38px; height: 38px; }
.ebtn:focus-visible, .cbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .chip, .btn { transition: background-color .15s, border-color .15s; } }
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  // ---------- 옵션 데이터 (단체주문양식 261013 옵션목록 시트 기준) ----------
  var MAC = ['민트','핑크','라벤더','블루','w민트','w핑크','w라벤더','w블루','m민트','m핑크','m라벤더','m블루'];
  // m(마블) 색상은 마카롱 네임택 전용 → 지비츠·운동화 등 나머지 상품은 m 제외
  var BASIC = MAC.filter(function (c) { return c.charAt(0) !== 'm'; }).concat(['화이트','블랙']);
  var MINI = ['민트','핑크','라벤더','블루','화이트','블랙'];
  var VIV = ['핫핑크','로얄블루','그린','오렌지'];
  var EMO = ['하트','별','같은색 하트','같은색 별','(없음)'];
  var VEMO = ['같은색 하트','같은색 별','(없음)'];
  var CLUB = ['배드민턴','야구','농구','볼링','탁구','축구','배드민턴(컬러)','야구(컬러)','농구(컬러)','볼링(컬러)','탁구(컬러)','축구(컬러)','(없음)'];
  var CNC = ['별','하트','구름','얼굴별','얼굴하트','얼굴조약돌','(없음)'];
  var JIB = ['미니','미니(성인용)','빅사이즈','빅사이즈(성인용)'];
  var SHOE = ['미니','빅사이즈'];
  // 2026-10-15 고리 옵션(아론): 마카롱·모노톤·미니 캡슐·미니 사각만. 처음 선택값 = 유색 D링(주문 기록상 가장 많음)
  var RINGS = ['유색 D링', '8자 고무줄', '유색 군번줄'];

  // name = 주문서(엑셀) 상품명 · label = 화면에 보이는 상품명 · img = 상품 이미지 경로 (비어 있으면 미리보기 태그로 대신 표시)
  var PRODUCTS = [
    { name: '마카롱', colors: MAC, emojis: EMO, rings: RINGS },
    { name: '리틀마카롱', colors: MAC, emojis: EMO },
    { name: '모노톤', colors: ['화이트','블랙'], emojis: EMO, rings: RINGS },
    { name: '빅마카롱', colors: BASIC, emojis: EMO, sizes: ['빅마카롱','더빅마카롱'] },
    { name: '마카롱 지비츠', colors: BASIC, emojis: EMO, sizes: JIB },
    { name: '마카롱 운동화', colors: BASIC, emojis: EMO, sizes: SHOE },
    { name: '비비드 지비츠', colors: VIV, emojis: VEMO, sizes: JIB },
    { name: '비비드 운동화', colors: VIV, emojis: VEMO, sizes: SHOE },
    { name: '미니 캡슐', colors: MINI, dirs: ['가로형','세로형'], rings: RINGS },
    { name: '미니 사각', colors: MINI, dirs: ['가로형','세로형'], rings: RINGS },
    { name: '마그넷', colors: BASIC.concat(VIV), emojis: EMO, vividEmojis: VEMO, sizes: SHOE },
    { name: '동호회 네임택', colors: BASIC, emojis: CLUB },
    { name: '쿠앤크 마블', colors: ['쿠앤크','오레오'], emojis: CNC, emojiTitle: '이모티콘 참', emojiRows: [3, 4], sizes: ['스몰','빅'] }
  ];
  // 스토어 상품명 → 주문서 상품명. 이 목록 순서대로 보이고, 목록에 없는 상품은 미출시라 숨김
  var STORE = [
    ['마카롱 네임택', '마카롱'],
    ['모노톤 네임택', '모노톤'],
    ['쿠앤크 마블 네임택', '쿠앤크 마블'],
    ['운동화 이름표', '마카롱 운동화'],
    ['마카롱 지비츠', '마카롱 지비츠'],
    ['비비드 지비츠', '비비드 지비츠'],
    ['미니 캡슐 네임택', '미니 캡슐'],
    ['미니 사각 네임택', '미니 사각']
  ];

  function headHtml(title, sub) {

  // 컬러: 시리즈별로 한 줄씩 (기본 / w / m / 화이트·블랙 / 비비드 / 기타)
  var SERIES = [
    { cap: '파스텔', test: function (c) { return ['민트','핑크','라벤더','블루'].indexOf(c) >= 0; } },
    { cap: 'w · 흰 바탕 + 컬러 글자', test: function (c) { return c.charAt(0) === 'w'; } },
    { cap: 'm · 마블 바탕 + 컬러 글자', test: function (c) { return c.charAt(0) === 'm'; } },
    { cap: '모노톤', test: function (c) { return c === '화이트' || c === '블랙'; } },
    { cap: '비비드', test: function (c) { return VIV.indexOf(c) >= 0; } }
  ];
  function colorPicker(list, cur) {
    var rows = [], used = {};
    SERIES.forEach(function (s) {
      var items = list.filter(function (c) { return s.test(c); });
      if (items.length) { rows.push({ cap: s.cap, items: items }); items.forEach(function (c) { used[c] = 1; }); }
    });
    var rest = list.filter(function (c) { return !used[c]; });
    if (rest.length) rows.push({ cap: '', items: rest });
    var showCap = rows.length > 1;
    var h = '<div class="field"><div class="crow" role="group" aria-labelledby="lbl-color" style="gap:12px">';
    rows.forEach(function (r) {
      h += '<div class="crow">' + (showCap && r.cap ? '<span class="cap">' + esc(r.cap) + '</span>' : '') + '<div class="cgrid">';
      r.items.forEach(function (c) {
        var st = tagStyle(c), shadow = textFx(st);
        h += '<button class="cbtn" type="button" data-act="set" data-f="color" data-v="' + esc(c) + '" aria-pressed="' + (cur === c) + '"><span class="mini" style="background:' + st.bg + ';color:' + st.fg + ';' + shadow + '">' + esc(c) + '</span></button>';
      });
      h += '</div></div>';
    });
    return h + '</div></div>';
  }
  function emojiPicker(list, cur, color, rows, product) {
    function btn(e) {
      var a = emojiArt(e, color, product);
      return '<button class="ebtn" type="button" data-act="set" data-f="emoji" data-v="' + esc(e) + '" aria-pressed="' + (cur === e) + '"><span class="ei' + (a.charm ? ' charm' : '') + '" style="background:' + a.bg + '">' + a.html + '</span><span>' + esc(e.replace('(없음)', '없음')) + '</span></button>';
    }
    var h = '<div class="field"><div class="crow" role="group" aria-labelledby="lbl-emoji">';
    if (rows) {
      // 줄 구성이 정해진 상품: 줄마다 같은 칸 수(가장 긴 줄 기준)로 맞춰 정렬
      var cols = Math.max.apply(null, rows), i = 0;
      rows.forEach(function (n) {
        h += '<div class="cgrid" style="grid-template-columns:repeat(' + cols + ', minmax(0, 1fr))">' + list.slice(i, i + n).map(btn).join('') + '</div>';
        i += n;
      });
    } else {
      h += '<div class="egrid">' + list.map(btn).join('') + '</div>';
    }
    h += '</div>';
    if (!color) h += '<span class="hint">같은색 이모티콘은 컬러를 고르면 그 색으로 보여요</span>';
    return h + '</div>';
  }

  function optChips(label, list, cur, field, colorDots) {
    var h = '<div class="field"><div class="chips" role="group" aria-labelledby="lbl-' + field + '">';
    list.forEach(function (v) {
      var dot = '';
      if (colorDots) { var st = tagStyle(v); dot = '<span class="sw" style="background:' + st.bg + '"></span>'; }
      h += '<button class="chip" type="button" data-act="set" data-f="' + field + '" data-v="' + esc(v) + '" aria-pressed="' + (cur === v) + '">' + dot + esc(v) + '</button>';
    });
    return h + '</div></div>';
  }

  function productPicker(d) {
    var p = prod(d.product);
    if (p && !d.pickOpen) {
      var img = p.img ? '<img src="' + esc(p.img) + '" alt="">' : '';
      return '<div class="psel">' + (img ? '<span class="pimg sm">' + img + '</span>' : '') + '<b>' + esc(plabel(p.name)) + '</b><button class="btn sm" type="button" data-act="open-products">상품 변경</button></div>';
    }
    var h = '<div class="pgrid sm" role="group" aria-labelledby="lbl-product">';
    SHOWN.forEach(function (x) {
      var img = x.img ? '<img src="' + esc(x.img) + '" alt="">' : tagHtml(x.label || x.name, { color: x.colors[0], emoji: x.emojis ? x.emojis[0] : '' });
      h += '<button class="pcard" type="button" data-act="set" data-f="product" data-v="' + esc(x.name) + '" aria-pressed="' + (d.product === x.name) + '"><span class="pimg' + (x.img ? ' photo' : '') + '">' + img + '</span><b>' + esc(x.label || x.name) + '</b></button>';
    });
    return h + '</div>';
  }

  function editorHtml() {
    var d = S.editing, p = prod(d.product), h = [];
    h.push('<div class="card editor"><h3>' + (d.id ? '그룹 수정' : '새 그룹') + '</h3>');
    var n = 0;
    function step(id, title, val, body, isLabel) {
      n++;
      var t = isLabel ? '<label class="stitle" id="lbl-' + id + '" for="names">' + title + '</label>' : '<span class="stitle" id="lbl-' + id + '">' + title + '</span>';
      return '<div class="step"><div class="shead"><span class="snum">' + n + '</span>' + t + '<span class="sval' + (val ? '' : ' todo') + '" id="sv-' + id + '">' + esc(val || '선택 전') + '</span></div>' + body + '</div>';
    }
    h.push(step('product', '상품', p ? plabel(p.name) : '', productPicker(d)));
    if (p) {
      var el = emojiList(p, d.color);
      h.push(step('color', '컬러', d.color, colorPicker(p.colors, d.color)));
      if (el) h.push(step('emoji', p.emojiTitle || '이모티콘', d.emoji ? d.emoji.replace('(없음)', '없음') : '', emojiPicker(el, d.emoji, d.color, p.emojiRows, d.product)));
      if (p.sizes) h.push(step('size', '사이즈', d.size, optChips('사이즈', p.sizes, d.size, 'size')));
      if (p.dirs) h.push(step('dir', '방향', d.dir || '가로형', optChips('방향', p.dirs, d.dir || '가로형', 'dir')));
      if (p.rings) h.push(step('ring', '고리', d.ring || RINGS[0], optChips('고리', p.rings, d.ring || RINGS[0], 'ring')));
      var cnt = parseNames(d.text).length;
      h.push(step('names', '이름', cnt ? cnt + '명' : '', '<div class="field"><textarea id="names" placeholder="김서아&#10;이하윤&#10;박지안">' + esc(d.text) + '</textarea><span class="hint">한 줄에 한 명, 또는 쉼표로 구분해요. 앞 번호(1. 2.)는 자동으로 빠져요</span></div><div id="pv"></div>', true));
    }
    var why = draftReady(d);
    h.push('<div class="row">' + (S.groups.length || d.id ? '<button class="btn" type="button" data-act="cancel">취소</button>' : '') + '<button class="btn primary" type="button" data-act="save-group" id="save-group"' + (why ? ' disabled' : '') + '>' + (d.id ? '수정 완료' : '그룹 추가') + '</button></div>');
    h.push('<p class="hint" id="why">' + esc(why) + '</p></div>');
    return h.join('');
  }

  function renderPreview() {
    var box = document.getElementById('pv'); if (!box || !S.editing) return;
    var d = S.editing, names = parseNames(d.text);
    var g = { product: d.product, color: d.color, emoji: d.emoji };
    box.innerHTML = names.length
      ? '<div class="field"><span class="lbl">미리보기 · ' + names.length + '명 인식</span><div class="tags">' + names.map(function (n) { return tagHtml(n, g); }).join('') + '</div></div>'
      : '';
    var sv = document.getElementById('sv-names'); if (sv) { sv.textContent = names.length ? names.length + '명' : '선택 전'; sv.className = 'sval' + (names.length ? '' : ' todo'); }
    var why = draftReady(d), b = document.getElementById('save-group'), w = document.getElementById('why');
    if (b) b.disabled = !!why; if (w) w.textContent = why;
  }

  function renderBar() {
    var n = total(), ready = n > 0 && !S.editing;
    var msg = !n ? '그룹을 추가해 주세요' : S.editing ? '편집 중인 그룹을 완료해 주세요' : '';
    if (S.finishing) { bar.innerHTML = ''; bar.hidden = true; return; }
    if (S.saved) { bar.innerHTML = ''; bar.hidden = true; return; }
    bar.hidden = false;
    bar.innerHTML = '<div class="in"><div class="sum"><b>총 ' + n + '개</b><span>' + esc(S.error || msg || (S.groups.length + '그룹 · 상품 ' + products().length + '종')) + '</span></div><button class="btn primary" type="button" data-act="finish"' + (ready ? '' : ' disabled') + '>주문서 완료</button></div>';
  }

  function finishHtml() {
    var rows = S.groups.map(function (g, i) { return '<li>' + esc(plabel(g.product)) + ' · ' + esc(groupLabel(g)) + ' · <b>' + g.names.length + '개</b></li>'; }).join('');
    var off = (S.buyer.trim() && !S.sending) ? '' : ' disabled';
    var actions = ENDPOINT
      ? '<button class="btn primary need-buyer" type="button" data-act="submit"' + off + '>' + (S.sending ? '보내는 중…' : '주문서 보내기') + '</button>'
      : '<button class="btn primary need-buyer" type="button" data-act="download"' + off + '>주문서 파일 받기</button>';
    return '<section><div class="card"><h2>주문 확인</h2><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">' + rows + '</ol><p class="hint">총 ' + total() + '개</p>' +
      '<div class="field"><label for="buyer">스마트스토어 구매자명</label><input id="buyer" type="text" autocomplete="name" placeholder="홍길동" value="' + esc(S.buyer) + '"><span class="hint">결제하실 때의 이름과 같게 적어주세요</span></div>' +
      (S.error ? '<div class="note warn">' + esc(S.error) + '</div>' : '') +
      '<div class="row"><button class="btn" type="button" data-act="unfinish">수정하기</button>' + actions + '</div>' +
      (ENDPOINT && S.error ? '<button class="btn sm need-buyer" type="button" data-act="download"' + off + '>대신 파일로 받아 톡톡으로 보내기</button>' : '') +
      '</div></section>';
  }

  // 2026-10-14 아론 요청: 상품이 여러 종류면 상품마다 수량 안내, 이름칸은 '톡톡주문', 결제 후 톡톡으로 알리기(주문번호 불필요)
  function payStep(s) {
    var per = s.per && s.per.length ? s.per : [{ label: s.product, n: s.count }];
    var note = '<br><span style="font-size:13px;color:#8a7f79">이름 입력칸에는 <b>톡톡주문</b>이라고 적어 주세요</span>';
    if (per.length === 1) return '<li>스마트스토어에서 <b>' + esc(per[0].label) + '</b> 수량 <b>' + per[0].n + '개</b>로 주문·결제해 주세요' + note + '</li>';
    return '<li>스마트스토어에서 상품마다 수량을 맞춰 주문·결제해 주세요<ul style="margin:6px 0 2px;padding-left:18px">' +
      per.map(function (x) { return '<li><b>' + esc(x.label) + '</b> ' + x.n + '개</li>'; }).join('') + '</ul>' + note + '</li>';
  }

  function doneHtml() {
    var s = S.saved, h = '<section class="done"><div class="card">';
    if (s.sent) {
      h += '<div class="note ok">주문서가 접수됐어요</div><h2>주문번호 ' + esc(s.orderNo) + '</h2><p class="hint">' + esc(s.product) + ' · ' + s.count + '개</p>' +
        '<span class="lbl">다음 순서</span><ol>' + payStep(s) + '<li>결제 후 <b>톡톡으로 알려 주세요</b></li></ol>';
    } else {
      h += '<div class="note ok">주문서 파일을 만들었어요</div><h2>' + esc(s.filename) + '</h2><p class="hint">' + esc(s.product) + ' · ' + s.count + '개</p>' +
        '<span class="lbl">다음 순서</span><ol><li>받은 파일을 톡톡 채팅방에 보내주세요</li>' + payStep(s) + '<li>결제 후 <b>톡톡으로 알려 주세요</b></li></ol>' +
        '<div class="row"><button class="btn" type="button" data-act="download">파일 다시 받기</button></div>';
    }
    return h + '<div class="row"><button class="btn primary" type="button" data-act="back">새 주문서 작성</button></div></div></section>';
  }

  function submit() {
    if (S.sending || !S.buyer.trim()) return;
    S.sending = true; S.error = ''; render();
    var count = total(), prods = products().map(plabel).join(', ');
    // text/plain 으로 보내야 브라우저 사전요청(CORS) 없이 Apps Script 로 바로 전달됨
    fetch(ENDPOINT, { method: 'POST', body: JSON.stringify({ rows: buildRows() }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        S.sending = false;
        if (!j || !j.ok) throw new Error((j && j.error) || '');
        S.saved = { sent: true, orderNo: j.orderNo, count: count, product: prods, per: perProduct() }; S.finishing = false; S.confirm = ''; clearSent();
        render(); window.scrollTo(0, 0);
      })
      .catch(function () {
        S.sending = false; S.error = '전송하지 못했어요. 잠시 후 다시 보내거나, 아래 버튼으로 파일을 받아 톡톡으로 보내주세요';
        render();
      });
  }


  // ---------- 엑셀 생성 (양식 주문입력 시트와 같은 배치) ----------
  function buildRows() {
    var rows = [];
    S.groups.forEach(function (g) {
      var p = prod(g.product), mini = isMini(g.product);
      g.names.forEach(function (n) {
        var emoji = mini ? '' : (g.emoji || '');
        var size = p.sizes ? (g.size || '') : '';
        var dir = mini ? (g.dir || '가로형') : '';
        var ring = ringOf(g);
        rows.push([S.buyer.trim(), g.product, n, g.color, emoji, size, dir, 1, optionInfo(g.product, n, g.color, emoji, size, dir, ring), ring]);
      });
    });
    return rows;
  }
  function buildXlsx() {
    var aoa = [
      ['리틀프린트 단체주문 입력 양식'],
      ['웹 주문서에서 자동 생성된 파일입니다'],
      ['구매자명\n(필수)', '상품명\n(필수)', '들어갈 이름\n(필수)', '컬러\n(필수)', '이모티콘\n(미니 제외 필수)', '사이즈\n(지비츠,운동화,마그넷)', '방향\n(미니 제품)', '수량\n(필수)', '옵션정보\n(자동생성)', '고리\n(마카롱·모노톤·미니)']
    ].concat(buildRows());
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 9 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: 9 } }];
    ws['!cols'] = [14, 22, 12, 12, 14, 14, 12, 8, 50, 14].map(function (w) { return { wch: w }; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '주문입력');
    return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  }
  function stamp() {
    var d = new Date(); function z(n) { return (n < 10 ? '0' : '') + n; }
    return String(d.getFullYear()).slice(2) + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes());
  }
  function download() {
    S.error = '';
    if (typeof XLSX === 'undefined') { S.error = '파일 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요'; renderBar(); return; }
    var buyer = S.buyer.trim().replace(/[\\/:*?"<>|]/g, '') || '주문';
    var filename = S.saved && S.saved.filename || ('리틀프린트_단체주문_' + buyer + '_' + stamp() + '.xlsx');
    // 파일로 받은 뒤엔 주문 내용을 지우고, '파일 다시 받기'용으로 만든 파일만 화면에 들고 있음
    var again = !S.groups.length && S.lastFile;
    var data = again ? S.lastFile.data : buildXlsx(), count = again ? S.saved.count : total();
    function done() { if (!again) { S.saved = { filename: filename, count: count, product: products().map(plabel).join(', '), per: perProduct() }; S.lastFile = { data: data }; clearSent(); } S.finishing = false; S.confirm = ''; render(); window.scrollTo(0, 0); }
    function fail(m) { S.error = m; render(); }
    var cl = window.claude;
    if (cl && typeof cl.use === 'function') {
      cl.use('downloads').then(function (dl) {
        if (!dl) return plain();
        dl.save({ filename: filename, data: new Blob([data]) }).then(done, function (e) {
          if (e && e.code === 'declined') fail('파일 저장을 취소했어요');
          else if (e && e.code === 'rate_limited') fail('잠시 후 다시 눌러주세요');
          else fail('이 화면에서는 파일을 저장할 수 없어요');
        });
      }, plain);
    } else plain();
    function plain() {
      try {
        var blob = new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        done();
      } catch (e) { fail('파일을 저장하지 못했어요. 다른 브라우저(크롬·사파리)에서 열어주세요'); }
    }
  }

  // ---------- 이벤트 ----------
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act'), v = t.getAttribute('data-v'), id = Number(t.getAttribute('data-id'));
    if (act !== 'del' && act !== 'reset') S.confirm = '';
    switch (act) {
      case 'open-products': S.editing.pickOpen = true; break;
      case 'new': S.editing = blankDraft(); break;
      case 'edit':
        var g = S.groups.filter(function (x) { return x.id === id; })[0];
        if (g) S.editing = { id: g.id, product: g.product, pickOpen: false, color: g.color, emoji: g.emoji, size: g.size, dir: g.dir, ring: g.ring || '', text: g.names.join('\n') };
        break;
      case 'cancel': S.editing = S.groups.length ? null : blankDraft(); break;
      case 'set':
        var f = t.getAttribute('data-f'), E = S.editing; E[f] = v;
        if (f === 'product') {
          var np = prod(v); E.pickOpen = false;
          if (np.colors.indexOf(E.color) < 0) E.color = '';
          if (!np.sizes || np.sizes.indexOf(E.size) < 0) E.size = '';
          if (!np.dirs) E.dir = '';
          if (!np.rings) E.ring = '';
        }
        if (f === 'product' || f === 'color') { var el = emojiList(prod(E.product), E.color); if (!el || el.indexOf(E.emoji) < 0) E.emoji = ''; }
        break;
      case 'save-group':
        var d = S.editing; if (draftReady(d)) return;
        var p = prod(d.product);
        var rec = { id: d.id || Date.now(), product: d.product, color: d.color, emoji: emojiList(p, d.color) ? d.emoji : '', size: p.sizes ? d.size : '', dir: p.dirs ? (d.dir || '가로형') : '', ring: p.rings ? (d.ring || RINGS[0]) : '', names: parseNames(d.text) };
        if (d.id) S.groups = S.groups.map(function (x) { return x.id === d.id ? rec : x; }); else S.groups.push(rec);
        S.editing = null; break;
      case 'ask-del': S.confirm = 'del-' + id; break;
      case 'del': S.groups = S.groups.filter(function (x) { return x.id !== id; }); S.confirm = ''; if (!S.groups.length && !S.editing) S.editing = blankDraft(); break;
      case 'toggle': S.expanded[id] = !S.expanded[id]; break;
      case 'download': if (!S.buyer.trim() && !S.lastFile) return; download(); return;
      case 'submit': submit(); return;
      case 'finish': S.finishing = true; S.error = ''; window.scrollTo(0, 0); break;
      case 'unfinish': S.finishing = false; break;
      case 'back': S.saved = null; S.lastFile = null; S.finishing = false; if (!S.groups.length) S.editing = blankDraft(); break;
      case 'ask-reset': S.confirm = 'reset'; break;
      case 'reset': S.groups = []; S.buyer = ''; S.saved = null; S.finishing = false; S.confirm = ''; S.editing = blankDraft(); break;
    }
    persist();
    var keepFocus = act === 'set';
    var y = window.scrollY; render(); renderPreview(); if (keepFocus) window.scrollTo(0, y);
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'names' && S.editing) { S.editing.text = ev.target.value; renderPreview(); }
    if (ev.target.id === 'buyer') { S.buyer = ev.target.value; persist(); document.querySelectorAll('.need-buyer').forEach(function (b) { b.disabled = !S.buyer.trim() || !!S.sending; }); }
  });

  render(); renderPreview();
})();
</script>

</body>
</html>
